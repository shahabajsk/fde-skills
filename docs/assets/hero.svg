<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 368" width="860" height="368" role="img" aria-label="fde-skills engagement lifecycle: discovery, eval harness, rollout runbook, incident review, with regulated readiness and stakeholder readout across every stage">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1b2230}
.t{font-size:15px;font-weight:600}
.b{font-size:12.5px;fill:#4a5361}
.h{font-size:17px;font-weight:700}
.q{font-size:12px;fill:#5b6472}
</style>
</defs>
<rect width="860" height="368" rx="14" fill="#ffffff" stroke="#dde1e6"/>
<text x="28" y="38" class="h">From "we want an agent" to "it runs in production and audit signed off"</text>
<text x="28" y="60" class="q">One skill per stage. Each tells your coding agent what to produce, when to stop, and which shortcuts to refuse.</text>

<g>
<rect x="28" y="84" width="176" height="104" rx="10" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="44" y="110" class="t">fde-discovery</text>
<text x="44" y="134" class="b">Problem brief with</text>
<text x="44" y="151" class="b">baselines, a will-not-</text>
<text x="44" y="168" class="b">automate list</text>
</g>
<g>
<rect x="232" y="84" width="176" height="104" rx="10" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="248" y="110" class="t">eval-harness</text>
<text x="248" y="134" class="b">Golden set, pass^k,</text>
<text x="248" y="151" class="b">escalation recall, cost</text>
<text x="248" y="168" class="b">per correct, a CI gate</text>
</g>
<g>
<rect x="436" y="84" width="176" height="104" rx="10" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
<text x="452" y="110" class="t">rollout-runbook</text>
<text x="452" y="134" class="b">Shadow, assisted, partial,</text>
<text x="452" y="151" class="b">full autonomy; kill switch</text>
<text x="452" y="168" class="b">and rollback</text>
</g>
<g>
<rect x="640" y="84" width="192" height="104" rx="10" fill="#fff4ec" stroke="#d9600b" stroke-width="1.5"/>
<text x="656" y="110" class="t">agent-incident-review</text>
<text x="656" y="134" class="b">Blameless postmortem:</text>
<text x="656" y="151" class="b">five questions, owned</text>
<text x="656" y="168" class="b">fixes</text>
</g>
<g fill="none" stroke="#5b6472" stroke-width="1.5">
<path d="M204 136H230" marker-end="url(#arr)"/>
<path d="M408 136H434" marker-end="url(#arr)"/>
<path d="M612 136H638" marker-end="url(#arr)"/>
<path d="M736 188V206H320V190" marker-end="url(#arr)"/>
</g>
<text x="528" y="221" class="q" text-anchor="middle">every incident becomes a new eval case</text>

<rect x="28" y="238" width="804" height="36" rx="8" fill="#f3f5f7" stroke="#c9ced5"/>
<text x="44" y="261" class="t" style="font-size:14px">regulated-readiness</text>
<text x="210" y="261" class="b">Residency, PII, audit trail, money movement, model risk, RBI and DPDP, EU AI Act, with sources</text>
<rect x="28" y="282" width="804" height="36" rx="8" fill="#f3f5f7" stroke="#c9ced5"/>
<text x="44" y="305" class="t" style="font-size:14px">stakeholder-readout</text>
<text x="210" y="305" class="b">One page per decision point: verdict first, decisions made, open decisions with owners and dates</text>

<text x="28" y="346" class="q">unattended-readiness: before it runs on a schedule, scan the loops with walkaway and guard commands with paranoid-sre.</text>
</svg>
