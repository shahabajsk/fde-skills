name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q
      - name: Example eval runs
        run: python skills/eval-harness/scripts/evalkit.py skills/eval-harness/examples/golden.jsonl skills/eval-harness/examples/predictions.jsonl
